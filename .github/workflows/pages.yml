name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install --global --ignore-scripts botdocs@0.5.0
      - run: python3 -m unittest test_build_docs -v
      - run: python3 build_docs.py
        env:
          GH_TOKEN: ${{ github.token }}
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          LIVE_URL: ${{ steps.pages.outputs.base_url }}/fingerprint.txt
        run: |
          live=$(curl -fsSL "$LIVE_URL" || true)
          if [ "$EVENT" = schedule ] && [ "$live" = "$(cat output/fingerprint.txt)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Docs unchanged since last deploy; skipping."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: output

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
